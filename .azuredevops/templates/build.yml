parameters:
  - name: arch
    type: string
  - name: target
    type: string
  - name: tool-chain
    type: string
  - name: legacy-debugger
    type: string
    default: '0'
  - name: officialBuild
    type: string
    default: '0'

steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      python -m pip install -r pip-requirements.txt
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $legacy = if ($env:BUILD_CORE -eq 'legacy') { 'TRUE' } else { 'FALSE' }
      $flavor = @("BUILD_ARCH=$env:BUILD_ARCH", "TARGET=$env:BUILD_TARGET",
          "TOOL_CHAIN_TAG=$env:BUILD_TOOL_CHAIN", "BLD_*_USE_LEGACY_C_CORE=$legacy",
          "BLD_*_LEGACY_DEBUGGER=$env:BUILD_LEGACY_DEBUGGER")
      foreach ($tool in @('stuart_setup', 'stuart_update', 'stuart_build')) {
          $buildOptions = @()
          if ($tool -eq 'stuart_build') {
              $buildOptions = @('BUILDREPORTING=TRUE', 'BUILDREPORT_TYPES=PCD DEPEX FLASH BUILD_FLAGS LIBRARY',
                  'LaunchLogOnSuccess=FALSE', 'LaunchLogOnError=FALSE')
          }
          & $tool -c MsvmPkg/PlatformBuild.py @flavor @buildOptions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
    displayName: Build Firmware
    env:
      BUILD_ARCH: ${{ parameters.arch }}
      BUILD_TARGET: ${{ parameters.target }}
      BUILD_TOOL_CHAIN: ${{ parameters['tool-chain'] }}
      BUILD_CORE: legacy
      BUILD_LEGACY_DEBUGGER: ${{ parameters['legacy-debugger'] }}
      SOURCE_ORIGIN: closed
      OFFICIAL_BUILD: ${{ parameters.officialBuild }}
