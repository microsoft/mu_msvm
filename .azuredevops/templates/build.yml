parameters:
  - name: officialBuild
    type: boolean
    default: false
  - name: builds
    type: object
    default:
      - {name: DEBUG_X64_ClangWin_Debugger, host: windows, arch: X64, target: DEBUG, tool_chain: CLANGPDB, compiler_source: windows_org, legacy_debugger: '1', salt: ''}
      - {name: RELEASE_X64_ClangWin, host: windows, arch: X64, target: RELEASE, tool_chain: CLANGPDB, compiler_source: windows_org, legacy_debugger: '0', salt: ''}
      - {name: RELEASE_AARCH64_ClangWin, host: windows, arch: AARCH64, target: RELEASE, tool_chain: CLANGPDB, compiler_source: windows_org, legacy_debugger: '0', salt: ''}
      - {name: DEBUG_X64_ClangVS_Debugger, host: windows, arch: X64, target: DEBUG, tool_chain: CLANGPDB, compiler_source: visual_studio, legacy_debugger: '1', salt: XDCV}
      - {name: RELEASE_X64_ClangVS, host: windows, arch: X64, target: RELEASE, tool_chain: CLANGPDB, compiler_source: visual_studio, legacy_debugger: '0', salt: XRCV}
      - {name: DEBUG_AARCH64_ClangVS, host: windows, arch: AARCH64, target: DEBUG, tool_chain: CLANGPDB, compiler_source: visual_studio, legacy_debugger: '0', salt: ADCV}
      - {name: RELEASE_AARCH64_ClangVS, host: windows, arch: AARCH64, target: RELEASE, tool_chain: CLANGPDB, compiler_source: visual_studio, legacy_debugger: '0', salt: ARCV}
      - {name: DEBUG_AARCH64_ClangWin, host: windows, arch: AARCH64, target: DEBUG, tool_chain: CLANGPDB, compiler_source: windows_org, legacy_debugger: '0', salt: ADCW}
      - {name: DEBUG_X64_ClangLinux_Debugger, host: linux, arch: X64, target: DEBUG, tool_chain: CLANGPDB, compiler_source: distribution, legacy_debugger: '1', salt: XDCL}
      - {name: RELEASE_X64_ClangLinux, host: linux, arch: X64, target: RELEASE, tool_chain: CLANGPDB, compiler_source: distribution, legacy_debugger: '0', salt: XRCL}
      - {name: DEBUG_AARCH64_ClangLinux, host: linux, arch: AARCH64, target: DEBUG, tool_chain: CLANGPDB, compiler_source: distribution, legacy_debugger: '0', salt: ADCL}
      - {name: RELEASE_AARCH64_ClangLinux, host: linux, arch: AARCH64, target: RELEASE, tool_chain: CLANGPDB, compiler_source: distribution, legacy_debugger: '0', salt: ARCL}
      - {name: RELEASE_X64_GCC, host: linux, arch: X64, target: RELEASE, tool_chain: GCC, compiler_source: distribution, legacy_debugger: '0', salt: XRG}

jobs:
  - ${{ each build in parameters.builds }}:
      - job: ${{ build.name }}
        displayName: ${{ format('{0} {1}', build.host, build.name) }}
        pool:
          type: ${{ build.host }}
        variables:
          WindowsContainerImage: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest
          LinuxContainerImage: onebranch.azurecr.io/linux/ubuntu-2404:latest
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
          arch: ${{ build.arch }}
          target: ${{ build.target }}
          tool_chain: ${{ build.tool_chain }}
          BuildDirectory: Build/Msvm${{ build.arch }}/${{ build.target }}_${{ build.tool_chain }}
          PackageName: $(Build.Repository.Name).mscoreuefi.${{ iif(parameters.officialBuild, '', 'PR.') }}${{ build.arch }}.${{ build.target }}${{ iif(eq(build.salt, ''), '', format('.{0}', build.salt)) }}${{ iif(and(parameters.officialBuild, eq(build.salt, '')), '', '.Test') }}
          ob_outputDirectory: $(Build.ArtifactStagingDirectory)/BUILD
          ob_artifactBaseName: drop_Build_${{ build.target }}_${{ build.arch }}_${{ build.tool_chain }}${{ iif(eq(build.salt, ''), '', format('_{0}', build.salt)) }}
          ob_pipelineartifacts_enabled: true
          ob_artifacts_main_condition: succeededOrFailed()
          ob_nugetPublishing_enabled: ${{ parameters.officialBuild }}
          ob_createvpack_enabled: ${{ and(parameters.officialBuild, eq(build.host, 'windows')) }}
          ob_createvpack_packagename: $(PackageName)
          ob_createvpack_description: Hyper V UEFI Firmware
          ob_createvpack_versionAs: parts
          ob_createvpack_majorVer: $(ReleaseMajor)
          ob_createvpack_minorVer: $(ReleaseMinor)
          ob_createvpack_metadata: $(Build.SourceVersion)
          ob_createvpack_vpackdirectory: $(ob_outputDirectory)/$(BuildDirectory)/Bin
          ob_createvpack_failOnStdErr: true
          ob_createvpack_verbose: true
        steps:
          - task: NuGetAuthenticate@1
            inputs:
              nuGetServiceConnections: WindowsPartners_NugetFeedConnection
          - task: PipAuthenticate@1
            inputs:
              artifactFeeds: $(System.TeamProject)/$(System.TeamProject)_PublicPackages

          - ${{ if eq(build.host, 'windows') }}:
              - template: /.azuredevops/templates/windows-python.yml@self
              - ${{ if eq(build.compiler_source, 'visual_studio') }}:
                  - pwsh: |
                      $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
                      $installation = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                      if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio 2022 was not found' }
                      $clangBin = Join-Path $installation 'VC/Tools/Llvm/x64/bin'
                      if (-not (Test-Path (Join-Path $clangBin 'clang.exe'))) { throw 'Visual Studio Clang was not found' }
                      Write-Host "##vso[task.setvariable variable=CLANG_BIN]$clangBin/"
                    displayName: Locate Visual Studio Clang
              - ${{ else }}:
                  - task: DownloadPackage@1
                    displayName: Download Windows-org LLVM Tools
                    inputs:
                      packageType: nuget
                      feed: ES-LLVM
                      definition: llvm.tools
                      version: '22.1.1-47'
                      downloadPath: $(Agent.TempDirectory)/windows-clang/bin
                  - task: DownloadPackage@1
                    displayName: Download Windows-org Clang Headers
                    inputs:
                      packageType: nuget
                      feed: ES-LLVM
                      definition: clang.headers
                      version: '22.1.1-47'
                      downloadPath: $(Agent.TempDirectory)/windows-clang/lib/clang/22
                  - pwsh: Write-Host "##vso[task.setvariable variable=CLANG_BIN]$env:AGENT_TEMPDIRECTORY/windows-clang/bin/"
                    displayName: Select Windows-org Clang

          - ${{ if eq(build.host, 'linux') }}:
              - bash: |
                  set -euo pipefail
                  shopt -s nullglob
                  for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
                    if [[ -f "$source" ]]; then
                      sed -i 's|://archive\.ubuntu\.com/|://azure.archive.ubuntu.com/|g' "$source"
                    fi
                  done
                  apt-get update
                  apt-get install -y python3-venv mono-devel
                  case "$BUILD_TOOL_CHAIN" in
                    CLANGPDB) apt-get install -y clang lld llvm ;;
                    GCC)
                      case "$BUILD_ARCH" in
                        X64) triple=x86_64; packages=x86-64 ;;
                        AARCH64) triple=aarch64; packages=aarch64 ;;
                        *) exit 2 ;;
                      esac
                      apt-get install -y "gcc-$packages-linux-gnu" "binutils-$packages-linux-gnu"
                      echo "##vso[task.setvariable variable=GCC_${BUILD_ARCH}_PREFIX]/usr/bin/$triple-linux-gnu-"
                      ;;
                    *) exit 2 ;;
                  esac
                  python3 -m venv "$BUILD_VENV"
                  echo "##vso[task.prependpath]$BUILD_VENV/bin"
                displayName: Prepare Linux Compiler and Python
                env:
                  BUILD_ARCH: ${{ build.arch }}
                  BUILD_TOOL_CHAIN: ${{ build.tool_chain }}
                  BUILD_VENV: $(Agent.TempDirectory)/firmware-venv

          - template: /.azuredevops/templates/repo-auth.yml@self
            parameters:
              mode: set

          - template: /.azuredevops/templates/build-stuart.yml@self
            parameters:
              arch: ${{ build.arch }}
              target: ${{ build.target }}
              tool-chain: ${{ build.tool_chain }}
              legacy-debugger: ${{ build.legacy_debugger }}
              officialBuild: ${{ parameters.officialBuild }}
          - ${{ if eq(build.host, 'windows') }}:
              - task: PublishSymbols@2
                displayName: Index Symbols
                inputs:
                  SearchPattern: $(BuildDirectory)/PDB/*.pdb
                  IndexSources: true
                  PublishSymbols: false

          - template: /.azuredevops/templates/repo-auth.yml@self
            parameters:
              mode: unset

          - template: /.azuredevops/templates/stage-artifacts.yml@self
            parameters:
              host: ${{ build.host }}
              compiler-source: ${{ build.compiler_source }}
              officialBuild: ${{ parameters.officialBuild }}

          - task: NuGetCommand@2
            displayName: Pack NuGet
            inputs:
              command: pack
              packagesToPack: MsvmPkg/HyperVUefi.NuSpec
              packDestination: $(ob_outputDirectory)/packages
              packTimezone: utc
              buildProperties: id=$(PackageName);version=$(ReleasePrefix)-$(Build.SourceBranchName).$(Build.SourceVersion)
          - ${{ if and(parameters.officialBuild, eq(build.host, 'windows')) }}:
              - task: PublishSymbols@2
                displayName: Publish Symbols
                inputs:
                  SymbolsFolder: $(BuildDirectory)/PDB
                  SearchPattern: '*.pdb'
                  IndexSources: false
                  PublishSymbols: true
                  SymbolServerType: TeamServices
                  SymbolsProduct: Hyper-V UEFI
