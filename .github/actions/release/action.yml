name: Release Firmware
description: Validate and archive the shared staged outputs, then publish a GitHub release

inputs:
  github-token:
    description: GitHub token used to create the release
    required: true

runs:
  using: composite
  steps:
    - name: Download firmware artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: firmware-*
        path: ${{ runner.temp }}/firmware-artifacts

    - name: Package release artifacts
      shell: bash
      env:
        RELEASE_COMMIT: ${{ github.sha }}
        ARTIFACT_INPUT: ${{ runner.temp }}/firmware-artifacts
        RELEASE_OUTPUT: ${{ runner.temp }}/firmware-release
      run: |
        set -euo pipefail
        shopt -s nullglob dotglob
        artifacts=("$ARTIFACT_INPUT"/*)
        if [[ ${#artifacts[@]} -eq 0 ]]; then
          echo "No firmware artifacts were downloaded" >&2
          exit 1
        fi
        version="$(jq -er '.base_version' "${artifacts[0]}/FwVersion/FirmwareVersion.json")"
        for directory in "${artifacts[@]}"; do
          jq -e --arg sha "$RELEASE_COMMIT" --arg version "$version" \
            '.git_commit == $sha and .source_origin == "open" and .flags == 2 and .base_version == $version' \
            "$directory/FwVersion/FirmwareVersion.json" > /dev/null
          test -s "$directory/FV/MSVM.fd"
          test -s "$directory/FwVersion/FwVersionBlob.bin"
        done
        mkdir "$RELEASE_OUTPUT"
        for directory in "${artifacts[@]}"; do
          name="$(basename "$directory")"
          (cd "$directory"; tar -czf "$RELEASE_OUTPUT/$name.tar.gz" -- *)
        done

    - name: Create GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_COMMIT: ${{ github.sha }}
        RELEASE_OUTPUT: ${{ runner.temp }}/firmware-release
      run: |
        set -euo pipefail
        artifacts=("$RUNNER_TEMP"/firmware-artifacts/*)
        base_version="$(jq -er '.base_version | select(test("^[0-9]+\\.[0-9]+$"))' "${artifacts[0]}/FwVersion/FirmwareVersion.json")"
        tags="$(gh api --paginate "repos/$RELEASE_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
        patch="$(printf '%s\n' "$tags" | jq -Rs --arg prefix "v$base_version." \
          'split("\n") | map(select(startswith($prefix)) | ltrimstr($prefix) | select(test("^[0-9]+$")) | tonumber) | (max // -1) + 1')"
        gh release create "v$base_version.$patch" \
          --repo "$RELEASE_REPOSITORY" --target "$RELEASE_COMMIT" \
          --generate-notes "$RELEASE_OUTPUT"/*.tar.gz
