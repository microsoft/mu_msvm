name: Test MSVM Firmware with OpenVMM
description: Boot every MSVM firmware artifact for the selected architecture with OpenVMM

inputs:
  arch:
    description: Firmware architecture (X64 on Linux or AARCH64 on Windows with WHP)
    required: false
    default: X64
  github-token:
    description: GitHub token used to query and download OpenVMM artifacts
    required: true

runs:
  using: composite
  steps:
    - name: Select architecture
      id: config
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        case "$ARCH:$RUNNER_OS:$RUNNER_ARCH" in
          X64:Linux:X64)
            echo "prefix=x64-linux" >> "$GITHUB_OUTPUT"
            echo "triple=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
            echo "firmware-dir=x86_64" >> "$GITHUB_OUTPUT"
            echo "image=ubuntu-25.04-server-cloudimg-amd64.vhd" >> "$GITHUB_OUTPUT"
            echo "test=openvmm_uefi_x64_ubuntu_2504_server_x64_boot" >> "$GITHUB_OUTPUT"
            echo "extension=" >> "$GITHUB_OUTPUT"
            echo "pipette-prefix=x64-linux-musl" >> "$GITHUB_OUTPUT"
            echo "temp-dir=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
            ;;
          AARCH64:Windows:ARM64)
            echo "prefix=aarch64-windows" >> "$GITHUB_OUTPUT"
            echo "triple=aarch64-pc-windows-msvc" >> "$GITHUB_OUTPUT"
            echo "firmware-dir=aarch64" >> "$GITHUB_OUTPUT"
            echo "image=ubuntu-24.04-server-cloudimg-arm64.vhd" >> "$GITHUB_OUTPUT"
            echo "test=openvmm_uefi_aarch64_ubuntu_2404_server_aarch64_boot" >> "$GITHUB_OUTPUT"
            echo "extension=.exe" >> "$GITHUB_OUTPUT"
            echo "pipette-prefix=aarch64-linux-musl" >> "$GITHUB_OUTPUT"
            echo "temp-dir=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unsupported firmware/runner combination: $ARCH:$RUNNER_OS:$RUNNER_ARCH"
            exit 1
            ;;
        esac

    - name: Download firmware artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: firmware-*-${{ inputs.arch }}-*
        path: ${{ runner.temp }}/firmware

    - name: Verify firmware matrix
      shell: bash
      env:
        FIRMWARE_ROOT: ${{ steps.config.outputs.temp-dir }}/firmware
      run: |
        mapfile -t firmware_files < <(
          find "$FIRMWARE_ROOT" -type f -name MSVM.fd | sort
        )

        if [[ "${#firmware_files[@]}" -eq 0 ]]; then
          echo "::error::No MSVM.fd files were downloaded from the completed build matrix"
          exit 1
        fi

    - name: Resolve latest usable OpenVMM main run
      id: openvmm
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFIX: ${{ steps.config.outputs.prefix }}
        PIPETTE_PREFIX: ${{ steps.config.outputs.pipette-prefix }}
      run: |
        required="$(jq -nc --arg prefix "$PREFIX" --arg pipette "$PIPETTE_PREFIX" \
          '[($prefix + "-vmm-tests-archive"), ($prefix + "-openvmm"), ($pipette + "-pipette")]')"
        response="$(gh api \
          "repos/microsoft/openvmm/actions/workflows/openvmm-ci.yaml/runs?branch=main&event=push&status=success&per_page=20")"

        run_id=""
        head_sha=""
        candidates="$(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<< "$response")"
        while IFS=$'\t' read -r candidate_id candidate_sha; do
          [[ -z "$candidate_id" ]] && continue
          artifact_pages="$(gh api --paginate --slurp \
            "repos/microsoft/openvmm/actions/runs/$candidate_id/artifacts?per_page=100")"
          artifacts="$(jq -c '[.[].artifacts[]]' <<< "$artifact_pages")"

          if jq -e --argjson required "$required" '
            [.[] | select(.expired == false) | .name] as $available
            | all($required[]; . as $name | $available | index($name) != null)
          ' <<< "$artifacts" > /dev/null; then
            run_id="$candidate_id"
            head_sha="$candidate_sha"
            break
          fi

          artifact_status="$(jq -r --argjson required "$required" '
            [
                $required[] as $name
                | if any(.[]; .name == $name and .expired == false) then empty
                  elif any(.[]; .name == $name) then "\($name) (expired)"
                  else "\($name) (missing)"
                  end
              ]
            | join(", ")
          ' <<< "$artifacts")"
          echo "Skipping OpenVMM run $candidate_id: $artifact_status"
        done <<< "$candidates"

        if [[ -z "$run_id" || -z "$head_sha" ]]; then
          echo "::error::No successful OpenVMM main run has all required artifacts"
          exit 1
        fi

        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
        echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
        echo "Using OpenVMM run $run_id at $head_sha"

    - name: Download OpenVMM test archive
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        repository: microsoft/openvmm
        run-id: ${{ steps.openvmm.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        name: ${{ steps.config.outputs.prefix }}-vmm-tests-archive
        path: ${{ runner.temp }}/openvmm-bundle

    - name: Download OpenVMM binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        repository: microsoft/openvmm
        run-id: ${{ steps.openvmm.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        name: ${{ steps.config.outputs.prefix }}-openvmm
        path: ${{ runner.temp }}/openvmm-bundle

    - name: Download OpenVMM pipette
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        repository: microsoft/openvmm
        run-id: ${{ steps.openvmm.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        name: ${{ steps.config.outputs.pipette-prefix }}-pipette
        path: ${{ runner.temp }}/openvmm-bundle

    - name: Checkout matching OpenVMM source metadata
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: microsoft/openvmm
        ref: ${{ steps.openvmm.outputs.head-sha }}
        path: openvmm-source
        persist-credentials: false

    - name: Download standalone cargo-nextest
      id: nextest
      shell: bash
      env:
        TEMP_ROOT: ${{ steps.config.outputs.temp-dir }}
        TRIPLE: ${{ steps.config.outputs.triple }}
        EXTENSION: ${{ steps.config.outputs.extension }}
      run: |
        version="$(sed -n 's/^pub const NEXTEST: &str = "\([^"]*\)";/\1/p' \
          openvmm-source/flowey/flowey_lib_hvlite/src/_jobs/cfg_versions.rs)"

        if [[ -z "$version" ]]; then
          echo "::error::Could not determine OpenVMM cargo-nextest version"
          exit 1
        fi

        destination="$TEMP_ROOT/nextest"
        mkdir -p "$destination"
        curl --fail --location \
          "https://get.nexte.st/$version/$TRIPLE.tar.gz" \
          --output "$TEMP_ROOT/nextest.tar.gz"
        tar -xf "$TEMP_ROOT/nextest.tar.gz" -C "$destination"
        chmod +x "$destination/cargo-nextest$EXTENSION"
        echo "binary=$destination/cargo-nextest$EXTENSION" >> "$GITHUB_OUTPUT"

    - name: Download Ubuntu test image
      shell: bash
      env:
        TEMP_ROOT: ${{ steps.config.outputs.temp-dir }}
        IMAGE_NAME: ${{ steps.config.outputs.image }}
      run: |
        image_dir="$TEMP_ROOT/openvmm-images"
        image="$image_dir/$IMAGE_NAME"
        expected_size=3758211584

        mkdir -p "$image_dir"
        curl --fail --location --retry 5 --retry-all-errors \
          "https://hvlitetestvhds.blob.core.windows.net/vhds/$IMAGE_NAME" \
          --output "$image"

        actual_size="$(stat --format=%s "$image")"
        if [[ "$actual_size" -ne "$expected_size" ]]; then
          echo "::error::Unexpected Ubuntu VHD size: expected $expected_size, found $actual_size"
          exit 1
        fi

    - name: Prepare Linux virtualization
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [[ ! -c /dev/kvm ]]; then
          echo "::error::The runner does not expose /dev/kvm"
          exit 1
        fi

        sudo chmod a+rw /dev/kvm
        echo 4096 | sudo tee \
          /sys/kernel/mm/hugepages/hugepages-2048kB/nr_overcommit_hugepages

    - name: Verify Windows virtualization
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $feature = Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform
        if ($feature.State -ne 'Enabled') {
          throw 'The ARM64 runner must have Windows Hypervisor Platform enabled and a running hypervisor'
        }

    - name: Prepare OpenVMM bundle
      shell: bash
      env:
        TEMP_ROOT: ${{ steps.config.outputs.temp-dir }}
        TRIPLE: ${{ steps.config.outputs.triple }}
        EXTENSION: ${{ steps.config.outputs.extension }}
        FIRMWARE_DIR: ${{ steps.config.outputs.firmware-dir }}
      run: |
        bundle="$TEMP_ROOT/openvmm-bundle"
        echo "Downloaded OpenVMM bundle:"
        find "$bundle" -maxdepth 4 -printf '%y %p\n' | sort

        normalize_bundle_file() {
          local name="$1"
          local relative_destination="$2"
          local destination="$bundle/$relative_destination"
          local matches=()

          mapfile -d '' matches < <(find "$bundle" -type f -name "$name" -print0)
          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one $name in the OpenVMM bundle; found ${#matches[@]}"
            printf 'Candidate: %s\n' "${matches[@]}"
            return 1
          fi

          if [[ "${matches[0]}" != "$destination" ]]; then
            mkdir -p "$(dirname "$destination")"
            cp "${matches[0]}" "$destination"
          fi
        }

        normalize_bundle_file "openvmm$EXTENSION" "$TRIPLE/openvmm$EXTENSION"
        normalize_bundle_file pipette "$FIRMWARE_DIR-unknown-linux-musl/pipette"
        normalize_bundle_file vmm_tests.tar.zst vmm_tests.tar.zst
        chmod +x \
          "$bundle/$TRIPLE/openvmm$EXTENSION" \
          "$bundle/$FIRMWARE_DIR-unknown-linux-musl/pipette"

    - name: Boot Ubuntu with every firmware
      working-directory: openvmm-source
      shell: bash
      env:
        BUNDLE: ${{ steps.config.outputs.temp-dir }}/openvmm-bundle
        FIRMWARE_ROOT: ${{ steps.config.outputs.temp-dir }}/firmware
        NEXTEST: ${{ steps.nextest.outputs.binary }}
        RESULTS_ROOT: ${{ steps.config.outputs.temp-dir }}/openvmm-test-results
        VMM_TEST_IMAGES: ${{ steps.config.outputs.temp-dir }}/openvmm-images
        TEMP_ROOT: ${{ steps.config.outputs.temp-dir }}
        FIRMWARE_DIR: ${{ steps.config.outputs.firmware-dir }}
        TEST_NAME: ${{ steps.config.outputs.test }}
        OPENVMM_REQUIRE_2MB_HUGETLB: ${{ runner.os == 'Linux' && '1' || '0' }}
      run: |
        mapfile -t firmware_files < <(
          find "$FIRMWARE_ROOT" -type f -name MSVM.fd | sort
        )

        workspace="$PWD"
        if [[ "$RUNNER_OS" == Windows ]]; then
          workspace="$(pwd -W)"
        fi

        destination="$BUNDLE/$FIRMWARE_DIR"
        mkdir -p "$destination" "$RESULTS_ROOT"
        overall_result=0

        for firmware in "${firmware_files[@]}"; do
          relative="${firmware#"$FIRMWARE_ROOT"/}"
          variant="${relative%%/*}"
          result_dir="$RESULTS_ROOT/$variant"
          temp_dir="$TEMP_ROOT/openvmm-test-temp/$variant"

          mkdir -p "$result_dir" "$temp_dir"
          cp "$firmware" "$destination/MSVM.fd"

          echo "::group::Testing $variant"
          if VMM_TESTS_CONTENT_DIR="$BUNDLE" \
            TEST_OUTPUT_PATH="$result_dir" \
            TMPDIR="$temp_dir" \
            TEMP="$temp_dir" \
            TMP="$temp_dir" \
            "$NEXTEST" nextest run \
              --archive-file "$BUNDLE/vmm_tests.tar.zst" \
              --workspace-remap "$workspace" \
              --config-file "$workspace/.config/nextest.toml" \
              --profile ci \
              --no-tests fail \
              --filter-expr \
                "test($TEST_NAME)"; then
            echo "$variant: passed"
          else
            echo "::error::$variant failed"
            overall_result=1
          fi
          echo "::endgroup::"
        done

        exit "$overall_result"

    - name: Upload OpenVMM test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: openvmm-${{ inputs.arch == 'X64' && 'x64' || 'aarch64' }}-firmware-test-results
        if-no-files-found: warn
        path: ${{ runner.temp }}/openvmm-test-results/
