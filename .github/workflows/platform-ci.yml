name: Platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matrix:
    name: Select Build Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Select open-source builds
        id: select
        shell: bash
        run: |
          matrix="$(python ci/scripts/matrix.py --matrix .github/build-matrix.json --format github)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.display_name }}
    needs: build-matrix
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pip-requirements.txt

      - name: Build firmware
        id: firmware
        uses: ./.github/actions/build
        env:
          OFFICIAL_BUILD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '0' }}
        with:
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          tool-chain: ${{ matrix.tool_chain }}
          core: ${{ matrix.core }}
          host: ${{ matrix.host }}
          compiler-source: ${{ matrix.compiler_source }}
          legacy-debugger: ${{ matrix.legacy_debugger }}

      - name: Stage and upload artifacts
        if: always()
        uses: ./.github/actions/stage-artifacts
        with:
          build-id: ${{ matrix.id }}
          artifact-name: ${{ matrix.artifact_name }}
          logs-artifact-name: ${{ matrix.logs_artifact_name }}
          build-succeeded: ${{ steps.firmware.outcome == 'success' }}

  source-checks:
    name: Source Checks
    runs-on: windows-2022
    steps:
      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pip-requirements.txt

      - name: Run source checks
        uses: ./.github/actions/source-checks

      - name: Stage source-check logs
        if: always()
        shell: pwsh
        env:
          ARTIFACT_OUTPUT: ${{ runner.temp }}/source-check-artifacts
        run: python -m ci.scripts.stage_artifacts --logs-only --output "$env:ARTIFACT_OUTPUT"

      - name: Upload source-check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-check-logs
          path: ${{ runner.temp }}/source-check-artifacts/logs/
          if-no-files-found: warn

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Release firmware
        uses: ./.github/actions/release
        with:
          github-token: ${{ github.token }}
