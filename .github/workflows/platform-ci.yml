name: Platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run stuart plugins to validate the source code
  source-checks:
    name: Source Checks
    runs-on: windows-2022
    steps:
      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pip-requirements.txt

      - name: Run source checks
        uses: ./.github/actions/source-checks

      - name: Upload source-check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-check-logs
          path: Build/
          if-no-files-found: warn

  # Creates a build matrix for different architectures and targets
  select-builds:
    name: Select Builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read build matrix
        id: select
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matrix = Get-Content .github/build-matrix.jsonc -Raw | ConvertFrom-Json
          "matrix=$($matrix | ConvertTo-Json -Depth 10 -Compress)" >> $env:GITHUB_OUTPUT

  # Build the firmware for different architectures and targets
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }} CLANGPDB (${{ matrix.core }})
    runs-on: windows-2022
    needs: select-builds
    env:
      OFFICIAL_BUILD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    steps:
      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pip-requirements.txt

      - name: Build firmware
        id: firmware
        uses: ./.github/actions/build
        with:
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          core: ${{ matrix.core }}

      - name: Stage and upload artifacts
        if: always()
        uses: ./.github/actions/stage-artifacts
        with:
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          artifact-name: firmware-${{ matrix.target }}-${{ matrix.arch }}-CLANGPDB${{ matrix.core == 'patina' && '-patina' || '' }}
          logs-artifact-name: logs-${{ matrix.target }}-${{ matrix.arch }}-CLANGPDB${{ matrix.core == 'patina' && '-patina' || '' }}
          build-succeeded: ${{ steps.firmware.outcome == 'success' }}

  # TODO: Test each built firmware artifact with OpenVMM
  #openvmm-test:
  #  name: OpenVMM Test
  #  runs-on: ubuntu-24.04
  #  needs: build
  #  steps:
  #    - name: Checkout repository
  #      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #      with:
  #        persist-credentials: false

  #    - name: Run OpenVMM tests
  #      uses: ./.github/actions/openvmm-test

  # Create a github release for the firmware (only on the main branch)
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release firmware
        uses: ./.github/actions/release
        with:
          github-token: ${{ github.token }}
