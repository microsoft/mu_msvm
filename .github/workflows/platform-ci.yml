name: Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

# Bump this when releasing a new major/minor version. The patch number
# auto-increments from the latest existing GitHub release with this prefix.
env:
  RELEASE_BASE_VERSION: "26.0"

jobs:
  source-checks:
    name: Source Checks
    runs-on: windows-2022
    steps:
      - name: Disable automatic line ending conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pip-requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r pip-requirements.txt

      - name: Run source checks
        id: source-checks
        uses: microsoft/mu_devops/.github/actions/stuart-ci@131433bb4f29d68250154cc66096f04c19fe3ee9 # v18.0.7
        with:
          packages: MsvmPkg
          targets: NO-TARGET
          architectures: X64,AARCH64
          toolchain: VS2022
          stuart-setup: true
          stuart-ci-setup: false
          stuart-args: >-
            --disable-all
            GuidCheck=run
            LineEndingCheck=run
            UncrustifyCheck=run

      - name: Upload source check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-check-logs
          path: ${{ steps.source-checks.outputs.log-path }}

  build:
    name: ${{ matrix.target }} ${{ matrix.arch }} ${{ matrix.tools }} DXE=${{ matrix.dxe-core }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [DEBUG, RELEASE]
        arch: [X64, AARCH64]
        tools: [VS2022, CLANGPDB]
        dxe-core: [legacy, patina]
        exclude:
          - arch: AARCH64
            tools: VS2022
          - tools: VS2022
            dxe-core: patina

    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pip-requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r pip-requirements.txt

      - name: Build platform
        uses: ./.github/actions/build-platform
        with:
          architecture: ${{ matrix.arch }}
          c-core: ${{ matrix.dxe-core == 'legacy' && 'TRUE' || 'FALSE' }}
          # Mark main-branch builds as official in the embedded firmware version record.
          official-build: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
          target: ${{ matrix.target }}
          tool-chain: ${{ matrix.tools }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.tools }}-dxe-${{ matrix.dxe-core }}
          if-no-files-found: error
          path: |
            Build/Msvm${{ matrix.arch }}/${{ matrix.target }}_${{ matrix.tools }}/FV/MSVM.fd
            Build/Msvm${{ matrix.arch }}/${{ matrix.target }}_${{ matrix.tools }}/MAP/
            Build/Msvm${{ matrix.arch }}/${{ matrix.target }}_${{ matrix.tools }}/PDB/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.tools }}-dxe-${{ matrix.dxe-core }}
          if-no-files-found: ignore
          path: |
            Build/**/BUILDLOG*.txt
            Build/**/BUILD_REPORT.TXT
            Build/**/OVERRIDELOG.TXT
            Build/SETUP*.txt
            Build/UPDATE*.txt

  openvmm-test-x64:
    name: OpenVMM Test X64
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test X64 firmware
        uses: ./.github/actions/openvmm-test
        with:
          github-token: ${{ github.token }}

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-checks, build, openvmm-test-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Release firmware
        uses: ./.github/actions/release
        with:
          base-version: ${{ env.RELEASE_BASE_VERSION }}
          github-token: ${{ github.token }}
